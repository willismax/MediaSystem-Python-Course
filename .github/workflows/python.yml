name: CI Pipeline  
  
on:  
  pull_request:  
    type: [ opened, synchronize ]  
  
  
jobs:  
  ci-pipeline:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v2  
      - name: Get changed files  
        uses: dorny/paths-filter@v2  
        id: filter  
        with:  
          list-files: shell  
          filters: |  
            py_modified:  
              - added|modified: "./**/*.py"  
      - name: Setup Python  
        if: ${{ steps.filter.outputs.py_modified == 'true' }}  
        uses: actions/setup-python@v5  
        with:  
          python-version: "3.10"  
          architecture: x64  
      - name: Install dependencies  
        if: ${{ steps.filter.outputs.py_modified == 'true' }}  
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install flake8 pytest
          eval "set -- ${{ steps.filter.outputs.py_modified_files }}"
          declare -A installed_requirements=()

          for file in "$@"; do
            search_dir="$(dirname "$file")"

            while true; do
              req_path="$search_dir/requirements.txt"
              if [ "$search_dir" = "." ]; then
                req_path="requirements.txt"
              fi

              if [ -f "$req_path" ]; then
                if [ -z "${installed_requirements[$req_path]+x}" ]; then
                  python -m pip install -r "$req_path"
                  installed_requirements["$req_path"]=1
                fi
                break
              fi

              if [ "$search_dir" = "." ]; then
                break
              fi

              parent_dir="$(dirname "$search_dir")"
              if [ "$parent_dir" = "$search_dir" ]; then
                break
              fi
              search_dir="$parent_dir"
            done
          done
      - name: Run flake8  
        if: ${{ steps.filter.outputs.py_modified == 'true' }}  
        shell: bash
        run: |
          eval "set -- ${{ steps.filter.outputs.py_modified_files }}"
          python -m flake8 "$@"
      - name: Run pytest  
        if: ${{ steps.filter.outputs.py_modified == 'true' }}  
        shell: bash
        run: |
          eval "set -- ${{ steps.filter.outputs.py_modified_files }}"
          declare -A test_dirs=()

          for file in "$@"; do
            dir="$(dirname "$file")"
            if compgen -G "$dir/test_*.py" > /dev/null; then
              test_dirs["$dir"]=1
            fi
          done

          if [ "${#test_dirs[@]}" -eq 0 ]; then
            echo "No pytest files found alongside changed Python files."
            exit 0
          fi

          for dir in "${!test_dirs[@]}"; do
            (cd "$dir" && python -m pytest test_*.py)
          done
